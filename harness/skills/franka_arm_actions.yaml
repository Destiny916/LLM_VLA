robot:
  name: franka_panda
  source: IsaacLab built-in FRANKA_PANDA_CFG
  primary_joint: panda_joint1
  unlocked_joints:
    - panda_joint1
    - panda_joint2
  locked_joints_policy: keep IsaacLab default joint targets for every joint except panda_joint1 and panda_joint2

execution:
  action_steps: 30
  reset_steps: 60
  max_default_steps: 240
  task_boundary_reset_required: true
  idle_hold:
    service_layer: true
    poll_interval_seconds: 0.01
    advances_simulation_when_no_command: true
    replaces_task_reset: false

actions:
  left_2rad:
    binary_meaning: "0"
    joint: panda_joint1
    target_rad: -2.0
    target_degrees: -114.591559
    semantic_when_down: 打招呼
    semantic_when_lifted: 泡咖啡
    requires_following_reset: false
  right_2rad:
    binary_meaning: "1"
    joint: panda_joint1
    target_rad: 2.0
    target_degrees: 114.591559
    semantic_when_down: 握手
    semantic_when_lifted: 做冰淇淋
    requires_following_reset: false
  lift_up:
    state_change:
      arm_lift: up
    joint_targets:
      panda_joint2: -0.8
    requires_put_down_before_reset: true
  put_down:
    state_change:
      arm_lift: down
    joint_targets:
      panda_joint2: 0.0
    equivalent_to_reset: false
  reset:
    task_boundary: true
    joint_targets:
      panda_joint1: 0.0
      panda_joint2: 0.0
    locked_joints: keep_default
  hold_reset:
    idle_hold: true
    joint_targets:
      panda_joint1: 0.0
      panda_joint2: 0.0
    locked_joints: keep_default
  stop:
    control_only: true
    standalone_only: true

composite_semantics:
  lifted_left_right_right:
    action_tokens: left_2rad right_2rad right_2rad
    semantic: 泡浓咖啡
  lifted_left_left_left:
    action_tokens: left_2rad left_2rad left_2rad
    semantic: 泡淡咖啡

removed_actions:
  left_circle:
    reason: removed because full-circle display is not distinct from repeated left actions in the simplified two-joint demo
  right_circle:
    reason: removed because full-circle display is not distinct from repeated right actions in the simplified two-joint demo
