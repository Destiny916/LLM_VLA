robot:
  name: franka_panda
  source: IsaacLab built-in FRANKA_PANDA_CFG
  controlled_joint: panda_joint1

execution:
  action_steps: 30
  reset_steps: 60
  max_default_steps: 180

actions:
  left:
    binary_meaning: "0"
    joint: panda_joint1
    target_rad: -2.0
    target_degrees: -114.591559
    requires_following_reset: true
  right:
    binary_meaning: "1"
    joint: panda_joint1
    target_rad: 2.0
    target_degrees: 114.591559
    requires_following_reset: true
  reset:
    joint: panda_joint1
    target_rad: 0.0
    requires_following_reset: false
